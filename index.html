<!-- Version 11 (2.3.2, RET-538/539). Version 10 (2.3.1 : plus de lien vers le manifeste, pour que l’icône ajoutée à l’écran d’accueil garde le lien entier, la semaine après le « # » comprise ; sans manifeste, l’iPhone et Android gardent l’adresse ouverte). Version 9 (2.3, T14 : d’un lien à l’autre, les séances faites et le journal gardés, rangés d’après l’étiquette de chaque séance, jamais d’après sa place). Version 8 (2.2-test8, lot 4 : deux semaines dans un lien, « La semaine suivante »). Version 7 (2.2-test6, lot 3 B de la 2.2 : la course guidée du billet ac.g et son retour co, l’effort de 0 à 10). Version 6 (2.1, lot 1 de la commande v11 : le moteur de séance unique, la maison en ronds et en coches, la fin de séance en visages, « Ma progression », les séances de l'athlète, « Finir sur son téléphone », le retour forme 3 ; format : FORMAT-TELEPHONE-V6.md). Version 5 (1.30-test23, lot C5 : la charte de l’appli et un mode sombre, celui du téléphone, DES-254). Version 4 (1.30-test12, lot 11 : la fiche conseil et les exercices à garder, à lire). Version 3 (12 novembre 2026, avec le lot 4 b : échauffement, supersets, circuits ; et le lot 5 : le pré-bilan de l'athlète ; la version 2 du 11 novembre).
     Revue avec la 1.30-test1 (lot 1 de la 1.30, 13 novembre) : le billet contrôlé champ par champ (AME-157), l'heure de chaque séance à la maison (AME-160),
     « Effacer mes données de ce téléphone » (AME-166), « − Une série » (AME-138), Repos · Chrono (ERG-184), la gêne sur la carte de la série (ERG-190),
     les kilos changés par le patient (AME-168), le bilan des séries avant l'envoi et l'ordre d'un circuit. Puis avec la 1.30-test3 (lot 3, l'audit du téléphone) :
     l'envoi qui ne se bloque plus sur un long journal (GT-1), « pas encore envoyées » et la garde des données (GT-2), une politique de sécurité (GT-5), les mots
     du chiffrement (GT-6), « Effacer » après l'envoi (GT-7), « Vos réponses partent à » (GT-8), « − » et « + » (V130-1-9). Puis avec la 1.30-test7 (lot 6, l'essai
     d'Antoine sur la v3 en ligne) : plus de choix Repos · Chrono, le chrono sur les seuls exercices tenus, le repos minuté en option ; les kilos dès que la dose parle
     de barre, d'haltère, de kettlebell ou de kg ; « − » dans la ligne de la série et « + Une série » en dernière ligne ; la valeur d'un exercice qui se mesure ;
     deux onglets (révision relue avant d'écrire) et le stockage plein dit. Hors de l'appli KINÉ : le « lecteur », la page du téléphone du patient. Elle est vide : ni patient, ni questionnaire,
     ni programme. Tout arrive par le lien, après le « # », que le navigateur n'envoie jamais à un serveur. Aucun appel réseau. -->

/* ---------- version 6 (2.1, lot 1 de la commande v11, telephone-2.md sur la maquette v14) ----------

:root{--okbg:#E9EDEC;--okf:#899E97;--waf:#B0A686;--prep:#3F5A80;--prepbg:#E3EAF3;--l2:#6A707A;--vis1:var(--alerte);--vis2:var(--vig);--vis3:var(--gris);--vis4:var(--ok);--vis5:var(--ok);--mouv:cubic-bezier(.3,.7,.2,1);--ressort:cubic-bezier(.34,1.56,.64,1)}

.v6-ecr .ic{position:absolute;left:50%;top:26px;width:34px;height:34px;margin-left:-17px;border-radius:9px;background:var(--accent);color:var(--onaccent);display:grid;place-items:center}
.v6-ecr .ic.t11c-ic{background:none;overflow:hidden}.v6-ecr .ic.t11c-ic img{width:100%;height:100%;display:block}
.v6-ecr .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.v6-band .btn{margin:10px;width:calc(100% - 20px);min-height:44px}
.v6-band p{margin:8px 12px;font-size:14.5px}
/* T15 : ce qui est gardé, pas encore envoyé */
.v6-sem{margin-top:16px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;border-top:1px solid var(--filet);padding-top:12px;font-size:14.5px;color:var(--gris)}
.v6-sem button{margin-left:auto;flex:none;min-height:44px;border-radius:10px;border:1px solid var(--accent);background:var(--carte);color:var(--accent);font:inherit;font-size:15px;font-weight:600;padding:0 12px}
.v6-sem button.v6-doux{margin-left:0;border-color:var(--filet);font-weight:400;color:var(--encre)}
.v6-pt{font-size:14px;color:var(--gris);text-align:center;margin:6px 0 0}
.v6-pil{display:inline-flex;align-items:center;min-height:44px;border:0;background:none;color:var(--accent);font:inherit;font-size:15px;font-weight:600;padding:0 2px;text-decoration:none}
/* T14 : le journal rendu */
.v6-revenu{display:flex;gap:8px;align-items:center;background:var(--okbg);color:var(--ok);border-radius:10px;padding:10px 12px;font-size:15px;margin:8px 0 4px}
.v6-revenu svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* P4 : le lien d'un autre jour ; le bandeau pousse et ne bloque rien */
.v6-p4{margin:0 0 8px;background:var(--watchbg);color:var(--vig);border-radius:10px;padding:8px 12px;font-size:14.5px}
/* 146 : cinq visages ; 143 : la colonne au pouce, grise ; les phrases à côté */
.v6-vis{display:flex;justify-content:space-between;gap:4px}
.v6-vis button{width:58px;height:58px;border-radius:50%;border:2px solid var(--fc);background:var(--carte);padding:8px;color:var(--fc);transition:background .2s}
.v6-vis button[aria-pressed=true]{border-color:var(--fc)!important;background:var(--fc)!important;color:var(--onaccent)!important}
.v6-vis svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;display:block}
.v6-duo{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start;margin-top:18px}
.v6-duo h2{margin-top:0}
.v6-col{width:84px;height:230px;border-radius:24px;background:var(--wash);border:1px solid var(--filet);overflow:hidden;display:flex;flex-direction:column-reverse;touch-action:none;-webkit-user-select:none;user-select:none}
.v6-col button{flex:1;min-height:0;border:0;border-top:1px dashed transparent;background:none;padding:0;font-size:0;color:transparent}
.v6-col button[data-v="0"]{flex:0 0 14px}
.v6-col button.on{background:var(--gris)}
.v6-col button[data-v="3"],.v6-col button[data-v="6"],.v6-col button[data-v="8"]{border-top-color:var(--l3)}
.v6-col button[aria-pressed=true]{background:var(--gris)!important;border-color:transparent!important}
.v6-col button[data-v="0"][aria-pressed=true]{background:var(--l3)!important}
.v6-lu{margin-top:8px}
.v6-lu b{font-size:38px;line-height:1;font-variant-numeric:tabular-nums;display:block}
.v6-lu span{font-size:14px;color:var(--gris)}
.v6-phr{display:flex;flex-direction:column;gap:6px}
.v6-phr button{text-align:left;border:1px solid var(--filet);background:var(--carte);color:var(--encre);border-radius:999px;padding:5px 14px;font:inherit;font-size:15px;min-height:41px}
.v6-phr button[aria-pressed=true]{background:var(--okbg)!important;border-color:var(--ok)!important;color:var(--ok)!important;font-weight:600}
/* D11 : « Pourquoi ? » pour ce qui n'a pas été fait */
.v6-pq{margin:10px 0;padding:10px 12px;border:1px solid var(--filet);border-radius:14px;background:var(--carte)}
.v6-pq b{display:block;font-size:15px}
.v6-pq div{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.v6-pq button,.v6-sautr button{font:inherit;font-size:14.5px;padding:3px 12px;border-radius:999px;border:1px solid var(--waf);background:var(--carte);color:var(--encre);min-height:36px}
.v6-pq button[aria-pressed=true]{background:var(--watchbg)!important;border-color:var(--waf)!important;color:var(--vig)!important;font-weight:600}
/* 150 : le choix qui remplit la carte */
.v6-trois{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.v6-trois button{min-height:64px;border-radius:14px;border:1.5px solid var(--bc);background:var(--carte);color:var(--bc);font:inherit;font-size:16px;padding:8px 4px}
.v6-trois.choisi button{display:none}
.v6-trois.choisi button[aria-pressed=true]{display:block;grid-column:1/-1;background:var(--bc)!important;border-color:var(--bc)!important;color:var(--onaccent)!important;font-weight:700;animation:v6-etend .4s var(--mouv)}
@keyframes v6-etend{from{clip-path:inset(0 33% 0 33% round 14px)}to{clip-path:inset(0 0 0 0 round 14px)}}
/* 123 : le résumé calme ; 122 : le palier, dit une fois */
.v6-chif{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.v6-chif div{background:var(--carte);border:1px solid var(--filet);border-radius:10px;padding:12px 6px;text-align:center}
.v6-chif b{display:block;font-size:30px;font-variant-numeric:tabular-nums}
.v6-chif small{color:var(--gris);font-size:13.5px}
.v6-palier{display:flex;gap:12px;align-items:center;background:var(--okbg);border-radius:10px;padding:12px;margin:8px 0}
.v6-palier svg{width:40px;height:40px;flex:none}
.v6-palier .arc{fill:none;stroke:var(--ok);stroke-width:3;stroke-dasharray:113;stroke-dashoffset:113;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .8s var(--mouv) .3s}
.v6-palier .co{fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s ease-out 1.1s}
.v6-palier.vu .arc,.v6-palier.vu .co{stroke-dashoffset:0}
.v6-palier p{margin:0;font-size:15.5px;color:var(--ok)}
/* 129 : le calendrier du mois ; « Depuis le début », « Prochaine étape », les derniers progrès */
.v6-mois{display:flex;align-items:center;justify-content:space-between;margin:22px 0 8px}
.v6-mois h2{margin:0;text-transform:capitalize}
.v6-mois button{width:44px;height:44px;border-radius:22px;border:1px solid var(--filet);background:var(--carte);color:var(--encre);font:inherit;font-size:24px;line-height:1}
.v6-mois button:disabled{opacity:.3}
.v6-cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;text-align:center;font-size:14px}
.v6-cal .j{color:var(--gris);font-size:13px;padding-bottom:2px}
.v6-cal .d{position:relative;height:36px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.v6-cal .d.fait::before{content:"";position:absolute;top:4px;bottom:4px;left:0;right:0;background:var(--okbg)}
.v6-cal .d.fait.deb::before{left:4px;border-radius:14px 0 0 14px}
.v6-cal .d.fait.fin::before{right:4px;border-radius:0 14px 14px 0}
.v6-cal .d.fait.deb.fin::before{border-radius:14px}
.v6-cal .d span{position:relative;z-index:1}
.v6-cal .d.fait span{color:var(--ok);font-weight:600}
.v6-cal .d.rep span::after{content:"";position:absolute;left:50%;bottom:-6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gris)}
.v6-cal .d.auj span{outline:2px solid var(--accent);outline-offset:6px;border-radius:50%}
.v6-cal .d.futur span{color:var(--l3)}
.v6-leg{display:flex;gap:14px;font-size:13px;color:var(--gris);margin-top:10px;flex-wrap:wrap}
.v6-leg i{display:inline-block;width:14px;height:10px;border-radius:5px;background:var(--okbg);margin-right:5px;vertical-align:-1px}
.v6-dep{display:flex;flex-direction:column;gap:10px}
.v6-dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:14.5px}
.v6-dl span{color:var(--gris)}.v6-dl b{font-size:15px;font-variant-numeric:tabular-nums}
.v6-dl .br{grid-column:1/-1;height:8px;border-radius:4px;background:var(--filet);overflow:hidden}
.v6-dl .br i{display:block;height:100%;width:0;background:var(--ok);border-radius:4px;transition:width 1s var(--mouv)}
.v6-etape small{display:block;font-size:13px;color:var(--gris)}
.v6-etape>b{display:block;font-size:17px;margin:2px 0 8px}
.v6-pts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.v6-pts i{width:22px;height:22px;border-radius:50%;border:2px solid var(--filet);display:grid;place-items:center;color:var(--onaccent)}
.v6-pts i.f{background:var(--ok);border-color:var(--ok)}
.v6-pts i svg{width:13px;height:13px}
.v6-pts span{font-size:13.5px;color:var(--gris);margin-left:4px}
.v6-pal{display:flex;gap:8px;align-items:center;font-size:15px;margin:8px 0}
.v6-pal>span{width:24px;height:24px;border-radius:50%;background:var(--ok);color:var(--onaccent);display:grid;place-items:center;flex:none}
.v6-pal svg{width:14px;height:14px}
.v6-pal.neuf path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s ease-out .5s}
.v6-pal.neuf.vu path{stroke-dashoffset:0}
/* la séance en salle : un seul moteur (écrans 5, 6 et 7), ici la forme du téléphone */
.v6-nav{display:flex;align-items:center;gap:8px;margin:6px 0 2px}
.v6-nav .ti{flex:1;min-width:0;text-align:center}
.v6-nav .ti small{display:block;font-size:13px;color:var(--gris)}
.v6-nav .ti b{display:block;font-size:20px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.v6-nav .fl{width:44px;height:44px;border-radius:22px;border:1px solid var(--filet);background:var(--carte);font:inherit;font-size:26px;line-height:1;color:var(--encre);flex:none;padding:0}
.v6-nav .fl:disabled{opacity:.3}
.v6-nav.ci .ti{text-align:left}
.v6-file{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.v6-file i{font-style:normal;font-size:13px;padding:2px 8px;border-radius:999px;background:var(--wash);color:var(--gris)}
.v6-file i.on{background:var(--accent);color:var(--onaccent);font-weight:600}
.v6-file i.f{text-decoration:line-through}
.v6-an{position:relative;width:44px;height:44px;flex:none;border:0;background:none;padding:0;border-radius:50%;color:var(--encre);font:inherit}
.v6-an svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.v6-an circle{fill:none;stroke-width:5}
.v6-an .fd{stroke:var(--filet)}.v6-an .pl{stroke:var(--ok)}
.v6-an b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.v6-an[aria-expanded=true]{box-shadow:0 0 0 2px var(--accent)}
.v6-hd{display:flex;gap:12px;align-items:center}
.v6-hd .v6-pc{width:64px;height:64px}
.v6-hd>div{flex:1;min-width:0}
.v6-cons{display:block;font-size:14.5px;line-height:1.3;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.v6-past{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 2px}
.v6-past li{display:inline-flex;align-items:center;gap:3px;font-size:13px;padding:2px 9px 2px 5px;border-radius:999px;background:var(--okbg);color:var(--ok);border:0}
.v6-past svg{width:14px;height:14px}
.v6-past li.sautee{background:var(--watchbg);color:var(--vig);padding:0}
.v6-past li.sautee button{border:0;background:none;color:inherit;font:inherit;font-size:13px;padding:2px 9px;min-height:28px}
.v6-serie{border-top:1px solid var(--filet);margin-top:10px;padding-top:10px}
.v6-ligne{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:16px;font-weight:600;margin:0 0 4px}
.v6-ligne .der{font-weight:400;font-size:13px;color:var(--gris);margin-left:4px}
.v6-ligne .cote{font-weight:400;font-size:14px;color:var(--gris);min-width:58px}
.v6-nb{width:52px!important;min-height:36px!important;padding:2px 2px!important;border:0!important;border-bottom:1.5px dashed var(--l3)!important;border-radius:0!important;font-weight:700;background:none!important}
.v6-stp{display:inline-flex;align-items:center;gap:2px}
.v6-stp button{width:38px;height:36px;border-radius:8px;border:1px solid var(--filet);background:var(--wash);color:var(--encre);font:inherit;font-size:20px;font-weight:700;line-height:1;padding:0}
.v6-ckk{margin:4px 0 0;font-size:14px;color:var(--prep);font-weight:600}
.v6-rir{margin-top:10px}
.v6-rir em,.v6-sautr em{font-style:normal;font-size:14px;color:var(--gris)}
.v6-rr{display:flex;gap:6px;margin:6px 0 8px}
.v6-rr button{flex:1;min-height:46px;border:1.5px solid var(--filet);background:var(--carte);color:var(--encre);border-radius:10px;font:inherit;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.v6-act{display:flex;gap:8px;margin-top:10px}
.v6-act button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;border-radius:10px;font:inherit;font-size:16px;font-weight:600}
.v6-act svg{width:20px;height:20px}
.v6-ok{border:0;background:var(--ok);color:var(--onaccent)}
.v6-ko{flex:0 0 auto!important;padding:0 14px;border:1.5px solid var(--alerte);background:var(--carte);color:var(--alerte)}
.v6-ko[aria-pressed=true]{background:var(--alerte)!important;border-color:var(--alerte)!important}
.v6-sautr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.v6-sautr .btn.lien{width:auto;min-height:36px;margin:0;border:0;padding:0 6px}
.v6-mal{margin-top:8px;font-size:14.5px;color:var(--vig);background:var(--watchbg);border-radius:8px;padding:6px 8px}
.v6-mal button{border:1px solid var(--waf);background:var(--carte);color:var(--encre);border-radius:999px;padding:2px 12px;font:inherit;font-size:14.5px;margin-left:4px;min-height:36px}
.v6-puis{font-size:13.5px;color:var(--gris);margin:8px 2px 0}
.v6-fini{display:flex;align-items:center;gap:6px;color:var(--ok);font-weight:600;margin:10px 2px 0}
.v6-ens{font-size:14px;color:var(--gris);margin:10px 4px 0}
.v6-grand{display:flex;flex-direction:column;align-items:center;margin-top:10px}
.v6-anneau{position:relative;width:150px;height:150px;border:0;background:none;padding:0;color:var(--encre);font:inherit}
.v6-anneau svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.v6-anneau[aria-pressed=true]{background:none!important;border-color:transparent!important;color:var(--encre)!important}
.v6-anneau circle{fill:none;stroke-width:9}
.v6-anneau .fd{stroke:var(--filet)}.v6-anneau .pl{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.v6-anneau b{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;padding-bottom:14px}
.v6-anneau small{position:absolute;left:0;right:0;bottom:40px;text-align:center;font-size:13px;color:var(--gris)}
.v6-b5{display:flex;gap:8px;margin-top:6px}
.v6-b5 button{min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--filet);background:var(--carte);color:var(--encre);font:inherit;font-size:15px}
.v6-ovl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--filet);background:none;padding:8px 2px;color:var(--encre);font:inherit;min-height:56px}
.v6-ovl .v6-pc{width:40px;height:40px;border-radius:8px}
.v6-ovl .t{flex:1;min-width:0}.v6-ovl .t b{display:block;font-size:16px}.v6-ovl .t small{font-size:13px;color:var(--gris)}
.v6-ovl .k{font-size:14px;color:var(--gris);font-variant-numeric:tabular-nums}
.v6-ovl .k svg{color:var(--ok)}
.v6-ovl.ici{background:var(--wash);border-radius:8px}
.v6-ovl.fini .t b{color:var(--gris);text-decoration:line-through}
.v6-ovl.cab{opacity:.6}
.v6-mode{display:flex;gap:6px}
.v6-mode button{flex:1;min-height:48px;border:2px solid var(--filet);background:var(--carte);color:var(--encre);border-radius:10px;font:inherit;font-size:15px;padding:4px 8px}
.v6-mode button[aria-pressed=true]{border-color:var(--accent)!important;background:var(--wash)!important;color:var(--encre)!important;font-weight:600}
.v6-impose{margin:12px 0 0;font-size:14.5px;color:var(--gris);background:var(--wash);border-radius:8px;padding:8px 10px}
.v6-der{list-style:none;margin:12px 0 6px;padding:0;counter-reset:d}
.v6-der li{display:flex;align-items:baseline;gap:8px;padding:8px 2px;border-top:1px solid var(--filet);counter-increment:d}
.v6-der li::before{content:counter(d);font-size:13px;color:var(--gris);min-width:14px}
.v6-der li b{flex:1;font-size:16px}
.v6-der li>span{font-size:14px;color:var(--gris);font-variant-numeric:tabular-nums;white-space:nowrap}
.v6-der small{display:block;font-weight:400;font-size:13px;color:var(--prep)}
.v6-act ol{margin:4px 0 0;padding-left:20px}
.v6-consk{margin:10px 0 0;font-size:14.5px;background:var(--prepbg);color:var(--encre);border-radius:8px;padding:8px 10px;line-height:1.35}
.v6-consk small{display:block;font-size:13px;color:var(--prep);font-weight:600}
/* les séances de l'athlète : une semaine dans un lien */
.v6-sl{display:flex;flex-direction:column;gap:8px}
.v6-sj{background:var(--carte);border:1px solid var(--filet);border-radius:14px;overflow:hidden}
.v6-sj-t{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;color:inherit;padding:12px;text-align:left;font:inherit;min-height:68px}
.v6-sj-t .jr{flex:none;width:46px;text-align:center;font-size:13px;color:var(--gris);line-height:1.1}
.v6-sj-t .jr b{display:block;font-size:20px;color:var(--encre);font-variant-numeric:tabular-nums}
.v6-sj-t .tt{flex:1;min-width:0}
.v6-sj-t .tt b{display:block;font-size:16.5px}
.v6-sj-t .tt small{color:var(--gris);font-size:14px}
.v6-sj-t .et{flex:none;font-size:13px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--wash);color:var(--gris)}
.v6-sj.fait .et{background:var(--okbg);color:var(--ok)}
.v6-sj.auj{border-color:var(--accent);border-width:1.5px}
.v6-sj.auj .et{background:var(--accent);color:var(--onaccent)}
.v6-sj-d{padding:0 12px 12px}
.v6-sj-d .v6-der{margin-top:0}
.v6-sj-d .btn{margin:8px 0 0}
/* 2.3.2, lot E (t11e), RET-546 : « Remplacer », sobre, à côté de « Sauter » ; les remplaçants s'ouvrent sur place */
.v6-act .t11e-b{flex:0 0 auto;padding:0 12px;border:1.5px solid var(--waf);background:var(--carte);color:var(--encre);font-weight:500}
.v6-act .t11e-b[aria-expanded=true]{background:var(--wash)}
.t11e-pan{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.t11e-pan em{font-style:normal;font-size:14px;color:var(--gris)}
.t11e-c{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--waf);border-radius:10px;background:var(--carte);color:var(--encre);font:inherit;font-size:16px;font-weight:600;padding:6px 8px;min-height:56px}
.t11e-c .v6-pc{width:44px;height:44px;border-radius:8px}
.t11e-c small{display:block;font-size:13px;font-weight:400;color:var(--gris)}
.t11e-pan .btn.lien{width:auto;min-height:40px;margin:0;padding:0 6px;text-align:left}

(function () {

    /* 2.3.2, lot D (RET-543, « Avant la séance ») : si [j, valeurs], la question ne se pose que si la question j du même questionnaire a une de ces réponses ;
       ex, les réponses exclusives d'une question à cases ; al et msg, le message montré sous une de ces réponses */
    if (Array.isArray(it.si) && it.si.length === 2 && nb(it.si[0], 0, 149, true) != null) o.si = [nb(it.si[0], 0, 149, true), textes(it.si[1], 30, 60)];

  var X = function (i) { return 6 + i * (W - 12) / (p.length - 1); }, Y = function (v) { return 6 + (H - 12) * (1 - (v - lo + pad) / (hi - lo + 2 * pad)); };
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true"><polyline points="' + p.map(function (q, i) { return X(i).toFixed(1) + ',' + Y(q[1]).toFixed(1); }).join(' ') + '"/>'
    + p.map(function (q, i) { return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(q[1]).toFixed(1) + '" r="3"/>'; }).join('') + '</svg>'; }
function sp3Nb(v) { return String(Math.round(v * 2) / 2).replace('.', ','); }
function sp3Vitesse(pg) { var l = (pg && pg.vt) || []; if (!l.length) return '';
  return '<h2>Vos tests de vitesse</h2><div class="carte sp3-vt" id="sp3-vt">' + l.map(function (x) { var p = x[2] || [], z = p[p.length - 1], a = p[0]; if (!z) return '';
    var d = z[1] - a[1], u = x[1] ? ' ' + esc(x[1]) : '';
    return '<div class="sp3-vl"><span>' + esc(x[0]) + '</span><b>' + sp3Nb(z[1]) + u + '</b>' + (p.length > 1 ? '<small>' + (d >= 0 ? '+' : '−') + sp3Nb(Math.abs(d)) + u + ' depuis le ' + dMini(a[0]) + '</small>' + sp3Courbe(p) : '<small>Le ' + dMini(z[0]) + '</small>') + '</div>'; }).join('') + '</div>'; }
})();
</script>

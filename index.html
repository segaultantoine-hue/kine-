<!-- Version 5 (1.30-test23, lot C5 : la charte de l’appli et un mode sombre, celui du téléphone, DES-254). Version 4 (1.30-test12, lot 11 : la fiche conseil et les exercices à garder, à lire). Version 3 (12 novembre 2026, avec le lot 4 b : échauffement, supersets, circuits ; et le lot 5 : le pré-bilan de l'athlète ; la version 2 du 11 novembre).
     Revue avec la 1.30-test1 (lot 1 de la 1.30, 13 novembre) : le billet contrôlé champ par champ (AME-157), l'heure de chaque séance à la maison (AME-160),
     « Effacer mes données de ce téléphone » (AME-166), « − Une série » (AME-138), Repos · Chrono (ERG-184), la gêne sur la carte de la série (ERG-190),
     les kilos changés par le patient (AME-168), le bilan des séries avant l'envoi et l'ordre d'un circuit. Puis avec la 1.30-test3 (lot 3, l'audit du téléphone) :
     l'envoi qui ne se bloque plus sur un long journal (GT-1), « pas encore envoyées » et la garde des données (GT-2), une politique de sécurité (GT-5), les mots
     du chiffrement (GT-6), « Effacer » après l'envoi (GT-7), « Vos réponses partent à » (GT-8), « − » et « + » (V130-1-9). Puis avec la 1.30-test7 (lot 6, l'essai
     d'Antoine sur la v3 en ligne) : plus de choix Repos · Chrono, le chrono sur les seuls exercices tenus, le repos minuté en option ; les kilos dès que la dose parle
     de barre, d'haltère, de kettlebell ou de kg ; « − » dans la ligne de la série et « + Une série » en dernière ligne ; la valeur d'un exercice qui se mesure ;
     deux onglets (révision relue avant d'écrire) et le stockage plein dit. Hors de l'appli KINÉ : le « lecteur », la page du téléphone du patient. Elle est vide : ni patient, ni questionnaire,
     ni programme. Tout arrive par le lien, après le « # », que le navigateur n'envoie jamais à un serveur. Aucun appel réseau. -->

<script>
(function () {
'use strict';
var VERSION_LECTEUR = 4;   /* 1.30-test12, lot 11 : 4, la fiche conseil (f) et les exercices à garder (p) ; le retour la renvoie (lv) : l'appli sait quelle page est en ligne, sans appel réseau */
var app = document.getElementById('app');
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); };
var auj = function () { var d = new Date(), z = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); };
var dCourte = function (d) { return d.slice(8, 10) + '/' + d.slice(5, 7); };
var lire = function (k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
var garder = function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };

/* 1.30-test1, AME-157 (audit B de Codex) : le billet est contrôlé champ par champ avant tout affichage. La page garde une copie neuve, faite des seuls
   champs qu'elle connaît, chacun à sa forme (texte, nombre, liste) et dans ses bornes ; un champ inconnu est laissé de côté ; un champ connu de travers
   (une longueur en texte, un nombre hors bornes, une liste trop longue, un texte démesuré) fait refuser tout le billet : « Lien refusé », rien n'en est
   montré. Les textes passent ensuite par esc() à l'affichage, les nombres sont des nombres : rien du billet ne peut s'écrire en HTML. */
var LIEN_MAX = 120000;   /* au-delà, le lien n'est même pas décodé */
var Billet = (function () {
  function non(m) { var e = new Error('refus'); e.refus = m; throw e; }
  function objet(v) { if (!v || typeof v !== 'object' || Array.isArray(v)) non('objet'); return v; }
  function txt(v, max) { if (v == null) return ''; if (typeof v === 'number' && isFinite(v)) v = String(v); if (typeof v !== 'string') non('texte'); if (v.length > max) non('texte trop long'); return v; }
  function nb(v, mi, ma, entier) { if (v == null || v === '') return null; var n = typeof v === 'number' ? v : typeof v === 'string' && /^\s*-?\d+([.,]\d+)?\s*$/.test(v) ? +v.trim().replace(',', '.') : NaN;
    if (!isFinite(n) || n < mi || n > ma) non('nombre'); return entier ? Math.round(n) : n; }
  function liste(v, max) { if (v == null) return []; if (!Array.isArray(v) || v.length > max) non('liste'); return v; }
  function textes(v, max, lg) { return liste(v, max).map(function (x) { return txt(x, lg); }); }
  function options(v) { return liste(v, 60).map(function (o) { if (!Array.isArray(o) || o.length < 2) non('choix'); return [txt(o[0], 60), txt(o[1], 400)]; }); }
  var SORTES = ['echelle', 'choix', 'nombre', 'visa8', 'texte', 'groupe', 'lignes', 'multi'], CHAMPS = ['texte', 'nombre', 'date', 'choix'];
  function champ(c) { objet(c); var t = c.t == null ? 'texte' : c.t; if (CHAMPS.indexOf(t) < 0) non('champ'); var o = {t: t, l: txt(c.l, 300)};
    if (t === 'choix') o.o = options(c.o); if (c.lg != null) o.lg = nb(c.lg, 1, 2000, true); return o; }
  function item(it) { objet(it); if (SORTES.indexOf(it.t) < 0) non('question'); var o = {t: it.t, q: txt(it.q, 1000)};
    if (it.f) o.f = 1; if (it.autre) o.autre = 1;
    if (it.intro != null) o.intro = txt(it.intro, 4000); if (it.na != null) o.na = txt(it.na, 200); if (it.unite != null) o.unite = txt(it.unite, 30);
    if (it.a != null) o.a = textes(it.a, 2, 200); if (it.o != null) o.o = options(it.o);
    if (it.min != null) o.min = nb(it.min, -100000, 100000); if (it.max != null) o.max = nb(it.max, -100000, 100000);
    if (o.min != null && o.max != null && o.min > o.max) non('bornes'); if (it.t === 'lignes' && o.max != null) o.max = Math.max(1, Math.min(20, Math.round(o.max)));

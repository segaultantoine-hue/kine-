     les kilos changés par le patient (AME-168), le bilan des séries avant l'envoi et l'ordre d'un circuit. Puis avec la 1.30-test3 (lot 3, l'audit du téléphone) :
     l'envoi qui ne se bloque plus sur un long journal (GT-1), « pas encore envoyées » et la garde des données (GT-2), une politique de sécurité (GT-5), les mots
     du chiffrement (GT-6), « Effacer » après l'envoi (GT-7), « Vos réponses partent à » (GT-8), « − » et « + » (V130-1-9). Hors de l'appli KINÉ : le « lecteur », la page du téléphone du patient. Elle est vide : ni patient, ni questionnaire,

<script>
(function () {
'use strict';
var VERSION_LECTEUR = 3;   /* le retour la renvoie (lv) : l'appli sait quelle page est en ligne, sans appel réseau */
var app = document.getElementById('app');
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); };
var auj = function () { var d = new Date(), z = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); };

var lire = function (k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };

/* 1.30-test1, AME-157 (audit B de Codex) : le billet est contrôlé champ par champ avant tout affichage. La page garde une copie neuve, faite des seuls
   champs qu'elle connaît, chacun à sa forme (texte, nombre, liste) et dans ses bornes ; un champ inconnu est laissé de côté ; un champ connu de travers
   (une longueur en texte, un nombre hors bornes, une liste trop longue, un texte démesuré) fait refuser tout le billet : « Lien refusé », rien n'en est

var LIEN_MAX = 120000;   /* au-delà, le lien n'est même pas décodé */

  function nb(v, mi, ma, entier) { if (v == null || v === '') return null; var n = typeof v === 'number' ? v : typeof v === 'string' && /^\s*-?\d+([.,]\d+)?\s*$/.test(v) ? +v.trim().replace(',', '.') : NaN;

  function textes(v, max, lg) { return liste(v, max).map(function (x) { return txt(x, lg); }); }
  function options(v) { return liste(v, 60).map(function (o) { if (!Array.isArray(o) || o.length < 2) non('choix'); return [txt(o[0], 60), txt(o[1], 400)]; }); }
  var SORTES = ['echelle', 'choix', 'nombre', 'visa8', 'texte', 'groupe', 'lignes', 'multi'], CHAMPS = ['texte', 'nombre', 'date', 'choix'];
  function champ(c) { objet(c); var t = c.t == null ? 'texte' : c.t; if (CHAMPS.indexOf(t) < 0) non('champ'); var o = {t: t, l: txt(c.l, 300)};
    if (t === 'choix') o.o = options(c.o); if (c.lg != null) o.lg = nb(c.lg, 1, 2000, true); return o; }
  function item(it) { objet(it); if (SORTES.indexOf(it.t) < 0) non('question'); var o = {t: it.t, q: txt(it.q, 1000)};
    if (it.f) o.f = 1; if (it.autre) o.autre = 1;
    if (it.intro != null) o.intro = txt(it.intro, 4000); if (it.na != null) o.na = txt(it.na, 200); if (it.unite != null) o.unite = txt(it.unite, 30);
    if (it.a != null) o.a = textes(it.a, 2, 200); if (it.o != null) o.o = options(it.o);
    if (it.min != null) o.min = nb(it.min, -100000, 100000); if (it.max != null) o.max = nb(it.max, -100000, 100000);
    if (o.min != null && o.max != null && o.min > o.max) non('bornes'); if (it.t === 'lignes' && o.max != null) o.max = Math.max(1, Math.min(20, Math.round(o.max)));
    if (it.lg != null) o.lg = nb(it.lg, 1, 2000, true);
    if (it.t === 'visa8') { o.br = liste(it.br, 6).map(function (b) { objet(b); var r = {k: txt(b.k, 8), cond: txt(b.cond, 600), q: txt(b.q, 1000), v: textes(b.v, 20, 20)}; if (b.temps != null) r.temps = textes(b.temps, 20, 200); return r; });
      if (it.temps != null) o.temps = textes(it.temps, 20, 200); }
    if (it.t === 'groupe' || it.t === 'lignes') { o.ch = liste(it.ch, 12).map(champ); if (!o.ch.length) non('champs'); }
    return o; }
  function quest(q) { objet(q); var o = {n: txt(q.n, 300), c: txt(q.c, 4000), it: liste(q.it, 150).map(item)}; if (!o.it.length) non('vide'); return o; }
  function pt(v, n) { if (!Array.isArray(v) || v.length < n) non('dessin'); return v.slice(0, n).map(function (z) { var x = nb(z, -200, 300); if (x == null) non('dessin'); return x; }); }

  function exo(x) { objet(x); var o = {n: txt(x.n, 300)}, r, kg, s, rp; if (!o.n.trim()) non('exercice');
    if (x.d != null) o.d = txt(x.d, 300); if (x.c != null) o.c = txt(x.c, 2000); if (x.cs != null) o.cs = textes(x.cs, 20, 600);

    if (x.g != null) o.g = dessin(x.g);

    if (x.u != null) { if (x.u !== 's') non('unité'); o.u = 's'; }
    if (x.q != null && x.q !== '') { if (x.q !== 'r' && x.q !== 'e') non('question'); o.q = x.q; }
    if (x.co != null) { if (x.co !== 1 && x.co !== 'G' && x.co !== 'D') non('côté'); o.co = x.co; }
    if ((rp = nb(x.rp, 0, 600, true)) != null) o.rp = rp; if (x.ss) o.ss = 1; if (x.kc) o.kc = 1;
    return o; }
  function lire(o) { objet(o); if (o.v !== 1) non('version'); var b = {v: 1, id: txt(o.id, 12), t: o.t};
    if (!/^[A-Za-z0-9]{4,12}$/.test(b.id)) non('envoi'); if (['q', 's', 'g'].indexOf(o.t) < 0) non('sorte');
    if (o.k != null && o.k !== '') { b.k = txt(o.k, 64); if (!/^[A-Za-z0-9_-]{16,64}$/.test(b.k)) non('clé'); }

    if (o.cab != null) b.cab = txt(o.cab, 200);
    if (o.mel != null && o.mel !== '') { b.mel = txt(o.mel, 200); if (!/^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']+$/.test(b.mel)) non('adresse'); }   /* la forme que l'appli accepte (telMelOk) */
    if (o.tel != null && o.tel !== '') b.tel = txt(o.tel, 40);
    if (o.lv != null) b.lv = nb(o.lv, 1, 99, true); if (o.nom != null) b.nom = txt(o.nom, 300); if (o.mot != null) b.mot = txt(o.mot, 2000);

    else { b.ex = liste(o.ex, 60).map(exo); if (!b.ex.length) non('vide');
      if (o.mo != null) { if (o.mo !== 'c') non('mode'); b.mo = 'c'; } if (o.to != null) b.to = nb(o.to, 1, 12, true);
      if (o.ec != null) b.ec = liste(o.ec, 30).map(exo); if (o.ect != null) b.ect = txt(o.ect, 4000);

<!DOCTYPE html>
<!-- Praticien, version 2 (2.5, lot H, RET-632) : un second billet, la réévaluation rapide (m « r ») : les lignes de la réévaluation ouverte au Mac et leurs valeurs
     d’avant, sous initiales, la douleur d’abord ; un appui par ligne, la décision, la note ; le retour par le même code KINE1 chiffré.
     Praticien, version 1 (2.3.3, lot F, RET-557, piste B « l’examen d’abord »). La page du téléphone du praticien, à côté de celle du patient (index.html),
     dans le même dépôt. Elle est vide : ni patient, ni test. Tout arrive par le lien, après le « # », que le navigateur n’envoie jamais à un serveur :
     les initiales et l’âge, la région, les tests et les amplitudes de l’examen, rien d’autre. Trois écrans : les tests à coter + / − à gauche et à droite
     (ou la valeur), les amplitudes (« Mesurer avec le téléphone » : l’inclinomètre, sinon la saisie au pouce) et un chrono, la note (dictée du clavier)
     puis « Renvoyer au Mac » : un code KINE1 chiffré, à copier ou en QR code, comme le retour du patient. « Effacer de ce téléphone » vide tout.
     Aucun appel réseau. Le script est dans praticien.js (la politique de sécurité n’accepte que les fichiers de la page). -->

<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KINÉ praticien">

<link rel="apple-touch-icon" href="icone.png">
<link rel="icon" type="image/png" href="icone.png">
<title>KINÉ · praticien</title>
<style>
:root{--encre:#1A1D22;--accent:#2A2D33;--ok:#3A5D52;--vig:#7C6A35;--alerte:#9B100E;--prep:#3F5A80;--prepbg:#E3EAF3;--okbg:#E6EFEB;--fond:#F4F5F7;--carte:#FFFFFF;--filet:#E0E2E6;--filet2:#EEEFF2;--gris:#4E535C;--onaccent:#FFFFFF;--wash:#EEEFF2;--l3:#BEC3C9;--onplein:#FFFFFF;--alertbg:#F6E4E2}
@media (prefers-color-scheme:dark){
  :root{--encre:#ECEDEF;--accent:#E6E5E2;--ok:#9DBAB1;--vig:#DCD29C;--alerte:#FD7964;--prep:#A9C0E0;--prepbg:#273244;--okbg:#26352F;--fond:#101215;--carte:#1B1E23;--filet:#2F343C;--filet2:#262A30;--gris:#A9AFB8;--onaccent:#141519;--wash:#24272C;--l3:#5C626B;--onplein:#141519;--alertbg:#3B2421;color-scheme:dark}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fond);color:var(--encre);font:17px/1.4 "Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1{font-size:22px;line-height:1.2;margin:14px 0 6px}
h2{font-size:17px;margin:18px 0 4px}
p{margin:8px 0}
.petit{font-size:14px;color:var(--gris);margin:4px 0}
.rien{font-size:13px;color:var(--gris);text-align:center;margin:10px 0 0}
.err{color:var(--alerte);font-weight:600}
.hp{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--gris);padding:4px 0 8px;border-bottom:1px solid var(--filet)}
.hp svg{width:22px;height:16px;fill:var(--accent);flex:none}
.hp b{color:var(--encre);letter-spacing:.04em}
.hp .pt{margin-left:auto;font-weight:700;color:var(--encre);background:var(--carte);border:1px solid var(--filet);border-radius:999px;padding:2px 10px;white-space:nowrap}
.onglets{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--fond);padding:8px 0 6px}
.onglets button{min-height:44px;border:1px solid var(--filet);border-radius:10px;background:var(--carte);font-size:14px;font-weight:600;color:var(--gris);padding:2px 4px;line-height:1.15}
.onglets button small{display:block;font-weight:500;font-size:12px}
.onglets button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.carte{background:var(--carte);border:1px solid var(--filet);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(26,29,34,.05)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:52px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--onaccent);font-weight:600;font-size:17px;margin:10px 0;padding:8px 12px;text-align:center;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--carte);color:var(--accent)}
.btn.okb{background:var(--ok);border-color:var(--ok);color:var(--onplein)}
.btn.rouge{background:var(--carte);border-color:var(--alerte);color:var(--alerte)}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{opacity:.45}
.lien{display:block;width:100%;border:0;background:none;color:var(--accent);text-decoration:underline;font-weight:500;min-height:44px;margin-top:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duo .btn{margin:4px 0;font-size:15px;min-height:46px}
/* écran 1 : les tests */
.tsts{padding:6px 12px}
.gt{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gris);margin:10px 0 2px}
.tr{padding:7px 0;border-bottom:1px solid var(--filet2)}
.tr:last-child{border-bottom:0}
.tl{display:flex;align-items:center;gap:6px}
.tn{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.pm{display:flex;align-items:center;gap:3px;flex:none}
.pm em{font-style:normal;font-size:12px;color:var(--gris);width:12px;text-align:center}
.pm button{width:40px;height:40px;border:1.5px solid var(--filet);border-radius:8px;display:grid;place-items:center;font-size:20px;font-weight:700;background:var(--carte);padding:0;line-height:1}
.pm button[aria-pressed=true].p{background:var(--alerte);border-color:var(--alerte);color:var(--onplein)}
.pm button[aria-pressed=true].m{background:var(--ok);border-color:var(--ok);color:var(--onplein)}
.pm button.pop{animation:pop .2s ease-out}
.pm+.pm{margin-left:6px}
.tv{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px 12px;margin-top:6px;font-size:14px;color:var(--gris)}
.tv label{display:flex;align-items:center;gap:5px}
.tv button{min-height:40px;border:1.5px solid var(--prep);border-radius:8px;background:var(--prepbg);color:var(--prep);font-size:14px;font-weight:600;padding:0 10px}
.nb{width:74px;min-height:40px;border:1.5px solid var(--filet);border-radius:8px;background:var(--carte);padding:4px 8px;font-size:18px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.nb:focus{outline:2px solid var(--prep);outline-offset:1px}
/* écran 2 : les amplitudes, le chrono */
.am{padding:6px 0 12px;border-bottom:1px solid var(--filet2)}
.am:last-child{border-bottom:0;padding-bottom:0}
.am>b{font-size:16px}
.am .ref{font-size:13px;color:var(--gris);font-weight:500;margin-left:6px}
.cg{display:flex;flex-wrap:wrap;gap:8px 18px;margin:6px 0 8px;align-items:center}
.cg label{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--gris);font-weight:600}
.cg i{font-style:normal;font-size:15px;color:var(--gris)}
.cg small{font-size:12px;font-weight:600;color:var(--ok);background:var(--okbg);border-radius:999px;padding:1px 7px}
.mes{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;border-radius:10px;border:1.5px solid var(--prep);color:var(--prep);background:var(--prepbg);font-weight:600}
.mes svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.chr{display:flex;align-items:center;gap:14px}
.anneau{position:relative;width:104px;height:104px;flex:none;display:block;border:0;background:none;padding:0;border-radius:50%}
.anneau svg{width:104px;height:104px;transform:rotate(-90deg);display:block}
.anneau circle{fill:none;stroke-width:8}
.anneau .fd{stroke:var(--filet2)}
.anneau .pl{stroke:var(--accent);stroke-dasharray:326.7;stroke-dashoffset:326.7;stroke-linecap:round}
.anneau span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.anneau b{font-size:22px;font-variant-numeric:tabular-nums}
.anneau small{font-size:12.5px;color:var(--gris)}
.anneau.va small{color:var(--alerte);font-weight:600}
.chd{flex:1;min-width:0}
.cibles{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.cibles button{min-height:40px;border:1.5px solid var(--filet);border-radius:999px;background:var(--carte);font-size:14px;font-weight:600;padding:0 12px}
.cibles button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.tps{list-style:none;margin:8px 0 0;padding:0;font-size:15px}
.tps li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0;font-variant-numeric:tabular-nums}
.tps button{border:0;background:none;color:var(--gris);text-decoration:underline;min-height:36px;font-size:14px}
/* écran 3 : la note, l'envoi */
.mic{text-align:center}
.micb{display:grid;place-items:center;width:72px;height:72px;margin:4px auto;border-radius:50%;border:0;background:var(--accent);color:var(--onaccent)}
.micb svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.mt{font-weight:600;margin:4px 0 8px}
textarea{display:block;width:100%;min-height:110px;border:1px solid var(--filet);border-radius:10px;padding:8px 10px;font-size:16px;background:var(--carte);resize:vertical}
textarea::placeholder{color:var(--l3)}
textarea:focus{outline:2px solid var(--prep);outline-offset:1px}
.rec{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:13px;color:var(--gris);padding:10px 6px}
.rec b{display:block;font-size:22px;color:var(--encre);font-variant-numeric:tabular-nums}
/* les feuilles : l'inclinomètre, le retour */
.voile{position:fixed;inset:0;background:rgba(16,18,21,.45);z-index:6}
.feuille{position:fixed;left:0;right:0;bottom:0;max-height:92vh;max-width:560px;margin:0 auto;background:var(--carte);border-radius:22px 22px 0 0;padding:16px 18px calc(20px + env(safe-area-inset-bottom));z-index:7;overflow:auto;animation:monte .25s cubic-bezier(.3,.7,.2,1)}
.feuille::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--filet);margin:-6px auto 10px}
.feuille h1{margin-top:0}
.gros{font-size:15px;margin:4px 0}
.jauge{display:block;width:220px;height:130px;margin:6px auto 0}
.jauge .fd{stroke:var(--filet)}
.jauge .arc{stroke:var(--prep)}
.jauge .aig path{stroke:var(--encre)}
.jauge .aig circle,.jauge .axe{fill:var(--encre)}
.jauge .aig{transform-origin:110px 115px;transition:transform .12s linear}
.ang{text-align:center;margin:-2px 0 6px}
.ang b{display:block;font-size:44px;line-height:1.05;font-variant-numeric:tabular-nums}
.ang span{font-size:14px;color:var(--gris)}
.qr{display:block;width:230px;max-width:100%;margin:10px auto;border:1px solid var(--filet);border-radius:12px;padding:6px;background:#fff}
.qr svg{display:block;width:100%;height:auto}
.code{display:block;width:100%;min-height:64px;max-height:90px;font:12px/1.3 ui-monospace,Menlo,monospace;word-break:break-all;color:var(--gris)}
/* 2.5, lot H, RET-632 : la réévaluation rapide (un appui par ligne, la carte se range, l'écart s'écrit) */
main.rmode{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
.rtete{position:sticky;top:0;z-index:3;background:var(--fond);margin:0 -16px;padding:0 16px 8px;border-bottom:1px solid var(--filet)}
.rtete h1{margin:10px 0 2px}
.rtete .petit b{color:var(--encre)}
.rbarre{height:4px;border-radius:4px;background:var(--wash);margin-top:6px;overflow:hidden}
.rbarre i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s ease}
.rf{margin:16px 2px 6px}
.rc{background:var(--carte);border:1px solid var(--filet);border-radius:14px;padding:14px 14px 12px;margin:8px 0;box-shadow:0 1px 2px rgba(26,29,34,.05)}
.rc h2{margin:0;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.rav{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;font-size:13.5px;color:var(--gris)}
.rav span{background:var(--wash);border-radius:999px;padding:3px 9px}
.rav b{color:var(--encre);font-weight:600}
.reva{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.reva button{position:relative;height:44px;border:1px solid var(--filet);border-radius:9px;background:var(--carte);font-weight:600;font-size:15px;padding:0}
.reva button.avant::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--l3)}
.reva button[aria-pressed=true],.rpm button[aria-pressed=true],.rchoix button[aria-pressed=true],.rmac button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.rleg{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--gris);margin-top:5px}
.rleg i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--l3);margin-right:4px;vertical-align:1px}
.rpm{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}
.rpm.r3{grid-template-columns:repeat(3,1fr)}
.rpm.cote{grid-template-columns:16px 1fr 1fr}
.rpm+.rpm{margin-top:8px}
.rpm button{min-height:52px;border:1px solid var(--filet);border-radius:12px;background:var(--carte);font-size:18px;font-weight:700;line-height:1.1;padding:4px 6px}
.rpm button small{display:block;font-size:12px;font-weight:500;opacity:.8}
.rpm.r3 button{font-size:15px}
.rpm em,.rnum em{font-style:normal;font-size:13px;font-weight:700;color:var(--gris);text-align:center}
.rnum{display:flex;align-items:center;gap:8px}
.rnum.cote em{width:16px;flex:none}
.rnum+.rnum{margin-top:6px}
.rnum button{width:52px;height:52px;flex:none;border:1px solid var(--filet);border-radius:12px;background:var(--carte);font-size:24px;font-weight:600;padding:0}
.rval{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:2px}
.rnb{width:100%;min-width:0;max-width:130px;border:0;border-bottom:1.5px solid var(--filet);background:none;text-align:center;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 2px}
.rnb:focus{outline:none;border-bottom-color:var(--prep)}
.rval small{flex:none;font-size:15px;color:var(--gris)}
.rinc{display:flex;gap:8px;margin-top:10px}
.rinc button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:1.5px solid var(--prep);border-radius:999px;background:var(--prepbg);color:var(--prep);font-size:14px;font-weight:600;padding:0 10px}
.rinc button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.rinc button.prim{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.rmac{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--gris)}
.rmac button{margin-left:auto;flex:none;min-height:44px;padding:0 14px;border:1.5px solid var(--prep);border-radius:999px;background:var(--prepbg);color:var(--prep);font-size:14px;font-weight:600}
.rc.range{padding:0;background:transparent;box-shadow:none}
.rres{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;border:0;background:none;padding:10px 14px;text-align:left;font-size:15px}
.rres b{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rres em,.rrel em{font-style:normal;font-weight:700;white-space:nowrap}
.rres i,.rrel i{font-style:normal;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
i.mieux{background:var(--okbg);color:var(--ok)}
i.pire{background:var(--alertbg);color:var(--alerte)}
i.pareil,i.neutre{background:var(--wash);color:var(--gris)}
.rok{color:var(--ok);font-weight:700}
.rail{color:var(--prep);font-weight:700}
.rc.vient{animation:range .3s ease-out}
.rchoix{display:grid;gap:6px}
.rchoix button{min-height:46px;border:1px solid var(--filet);border-radius:12px;background:var(--carte);font-size:15px;font-weight:600;text-align:left;padding:0 14px}
.rnote{display:flex;gap:8px;align-items:flex-start;margin-top:10px}
.rnote textarea{flex:1;min-height:48px}
.rnote .micb{width:48px;height:48px;margin:0;flex:none}
.rnote .micb svg{width:22px;height:22px}
.rpied{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;gap:12px;background:var(--carte);border-top:1px solid var(--filet);padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.rpied p{flex:1;min-width:0;margin:0;font-size:12.5px;color:var(--gris);line-height:1.3}
.rpied p b{display:block;color:var(--encre);font-size:14px}
.rpied .btn{width:auto;flex:none;margin:0;border-radius:999px;padding:0 18px;min-height:48px;white-space:nowrap;font-size:16px}
.rrel{list-style:none;margin:10px 0;padding:0;border:1px solid var(--filet);border-radius:12px}
.rrel li{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--filet2);font-size:14.5px}
.rrel li:last-child{border-bottom:0}
.rrel li span{flex:1;min-width:0}
.rrel li.rln em{font-weight:500;white-space:normal;text-align:right}
@keyframes range{from{opacity:.4;transform:scale(.98)}to{opacity:1;transform:none}}
/* 2.5, lot J : la tablette, l'iPad du cabinet (réflexion du 24/11, point 1). html.l25j-tab : au moins 700 × 600, tout en plus grand ;
   html.l25j-pay : en paysage (au moins 1 000 de large), les trois écrans côte à côte (praticien.js, l25jColonnes). Pas d'inclinomètre sur l'iPad. */
html.l25j-tab body{font-size:19px}
html.l25j-tab main{max-width:820px;padding-left:28px;padding-right:28px}
html.l25j-tab h1{font-size:26px;margin-top:18px}
html.l25j-tab h2{font-size:20px}
html.l25j-tab .hp{font-size:16px}
html.l25j-tab .petit{font-size:16px}
html.l25j-tab .onglets button{min-height:58px;font-size:17px}
html.l25j-tab .onglets button small{font-size:14px}
html.l25j-tab .tsts{padding:8px 18px}
html.l25j-tab .gt{font-size:14px;margin-top:14px}
html.l25j-tab .tr{padding:10px 0}
html.l25j-tab .tn{font-size:19px}
html.l25j-tab .pm{gap:6px}
html.l25j-tab .pm em{font-size:16px;font-weight:700;width:20px}
html.l25j-tab .pm button{width:58px;height:58px;border-radius:12px;font-size:28px}
html.l25j-tab .pm+.pm{margin-left:20px}
html.l25j-tab .tv{font-size:16px;gap:8px 16px}
html.l25j-tab .nb{width:96px;min-height:52px;font-size:22px}
html.l25j-tab .tv button,html.l25j-tab .cibles button{min-height:52px;font-size:16px;padding:0 16px}
html.l25j-tab .mes{display:none}
html.l25j-tab .am>b{font-size:19px}
html.l25j-tab .cg label{font-size:16px}
html.l25j-tab .anneau,html.l25j-tab .anneau svg{width:150px;height:150px}
html.l25j-tab .anneau b{font-size:32px}
html.l25j-tab .anneau small{font-size:15px}
html.l25j-tab .tps{font-size:17px}
html.l25j-tab .micb{width:88px;height:88px}
html.l25j-tab .micb svg{width:36px;height:36px}
html.l25j-tab textarea{font-size:19px;min-height:150px}
html.l25j-tab .rec{font-size:15px}
html.l25j-tab .rec b{font-size:28px}
html.l25j-tab .btn{min-height:60px;font-size:19px}
html.l25j-tab .feuille{max-width:640px}
html.l25j-tab .qr{width:300px}
html.l25j-pay main{max-width:1240px}
.l25j-cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.l25j-cols [data-a=ecran],.l25j-g .rien{display:none}
/* le point 2 : « Examen » | « Douleurs », le schéma des douleurs (corps.js) ; les types de douleur de KINÉ (--t1 à --t5, --tq sans type) */
:root{--t1:#376AC6;--t2:#AB3A0B;--t3:#B38D11;--t4:#37A496;--t5:#665E68;--tq:#ADB6C2;--l25j-fond:#F8F9FA;--l25j-img:.6;--l25j-filtre:none;--l25j-bord:#A7AFBA;--l25j-lim:#9EA7B3}
@media (prefers-color-scheme:dark){:root{--t1:#6893DE;--t2:#D77E4E;--t3:#E5C35C;--t4:#8DE5CA;--t5:#A4ACB0;--tq:#8290A3;--l25j-fond:#414A56;--l25j-img:.27;--l25j-filtre:invert(1) brightness(1.35);--l25j-bord:#748090;--l25j-lim:#9EA9B8}}
.l25j-vues{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 4px;max-width:520px}
.l25j-vues button{min-height:52px;border:1px solid var(--filet);border-radius:12px;background:var(--carte);font-size:17px;font-weight:700;color:var(--gris);line-height:1.15}
.l25j-vues button small{display:block;font-size:13px;font-weight:500}
.l25j-vues button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.l25j-dl{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
html.l25j-pay .l25j-dl{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.l25j-sch{background:var(--carte);border:1px solid var(--filet);border-radius:14px;padding:8px;margin-top:10px}
.l25j-corps{display:block;width:100%;height:auto;aspect-ratio:1296/1216;touch-action:manipulation}
.l25j-fond{fill:var(--l25j-fond)}
.l25j-img{opacity:var(--l25j-img);filter:var(--l25j-filtre);pointer-events:none}
.l25j-z{fill:transparent;cursor:pointer;pointer-events:all}
.l25j-z.note{fill-opacity:.9}
.l25j-bord{fill:none;stroke:var(--l25j-bord);stroke-width:.8;vector-effect:non-scaling-stroke;pointer-events:none}
.l25j-lims path{fill:none;stroke:var(--l25j-lim);stroke-width:.7;stroke-opacity:.55;vector-effect:non-scaling-stroke;pointer-events:none}
.l25j-lab text{font-size:34px;fill:var(--gris);font-weight:600}
.l25j-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.l25j-types button{display:flex;align-items:center;gap:10px;min-height:54px;border:1.5px solid var(--filet);border-radius:12px;background:var(--carte);font-size:17px;font-weight:600;padding:0 12px;text-align:left}
.l25j-types button i,.l25j-liste i{width:18px;height:18px;border-radius:50%;flex:none}
.l25j-types button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.l25j-liste{list-style:none;margin:6px 0 0;padding:0}
.l25j-liste li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--filet2);font-size:17px}
.l25j-liste span{flex:1;min-width:0}
.l25j-liste small{display:block;font-size:14px;color:var(--gris)}
.l25j-liste button{border:0;background:none;color:var(--gris);text-decoration:underline;min-height:44px;font-size:15px}
.rec.l25j-5{grid-template-columns:repeat(5,1fr)}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:none}}
@keyframes monte{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== 2.6, lot E1 (l26e1) : la page du praticien suit le téléphone homogène (DES-297 à DES-301, ERG-205, ERG-206, RET-715) et le modèle du Mac
   (DES-317, DES-318, ERG-228, ERG-229). ===== */
@font-face{font-family:'Source Sans 3';font-style:normal;font-display:swap;font-weight:400;src:url(source-sans-3-400.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-style:normal;font-display:swap;font-weight:600;src:url(source-sans-3-600.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-style:normal;font-display:swap;font-weight:700;src:url(source-sans-3-700.woff2) format('woff2')}
:root{--mk1:#6B717B;--mk2:#5A606B;--mk3:#23262D;--t-retour:.15s;--t-deplace:.22s;--t-remplit:.3s;--t-signal:1.2s}
@media (prefers-color-scheme:dark){:root{--mk1:#9AA0AA;--mk2:#9AA0AA;--mk3:#E8EAED}}
main{padding-top:0}
/* DES-297 : le bandeau, 50 px, collé en haut : la marque, « KINÉ », « praticien », la pastille du patient */
.hp{position:sticky;top:0;z-index:5;gap:8px;min-height:calc(50px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;margin:0 -16px 6px;background:var(--fond);border-bottom:1px solid var(--filet);font-size:16px}
.hp svg.l26e1-mk{width:34px;height:26px;margin-left:-4px;fill:none}
.l26e1-mk .mk1{fill:var(--mk1)}.l26e1-mk .mk2{fill:var(--mk2)}.l26e1-mk .mk3{fill:var(--mk3)}
.hp b{font-weight:700;letter-spacing:0}
.l26e1-role{font-size:14px;color:var(--gris)}
.onglets{top:calc(50px + env(safe-area-inset-top))}
.rtete .hp{margin:0 -16px 0}
html.l25j-tab .hp{font-size:17px;margin:0 -28px 8px;padding-left:28px;padding-right:28px}
/* ERG-206 point 6 : la barre du bas de l'examen ; DES-300 point 4 : rectangles arrondis de 10 px, cartes sans ombre */
.rpied .btn,.rinc button,.rinc button.prim,.rmac button{border-radius:10px}
.rpied{justify-content:center}.rpied p,.rpied .btn{max-width:528px}
.carte,.rc{box-shadow:none}
/* ERG-205 : le retour d'une feuille, en haut à gauche */
.l26e1-ft{display:flex;align-items:center;gap:4px;margin:-4px 0 6px}
.l26e1-ft h1{margin:0}
.l26e1-ret{flex:none;width:44px;height:44px;margin-left:-12px;border:0;border-radius:10px;background:none;color:var(--encre);display:grid;place-items:center;padding:0}
.l26e1-ret svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* DES-318 : 10 px pour une touche ou un champ, 14 px pour une case */
.pm button,.nb,.tv button,.reva button,.rpm button,.rnum button,.rchoix button,.l25j-vues button,.l25j-types button,.duo .btn,html.l25j-tab .pm button{border-radius:10px}
.rrel,.l25j-sch{border-radius:14px}
/* ERG-228 : sous le doigt ; ERG-229 : les durées du Mac */
.btn{transition:transform var(--t-retour),background-color var(--t-retour)}
.btn:active:not(:disabled){transform:scale(.97);transition-duration:.1s}
.pm button,.reva button,.rpm button,.rnum button,.rchoix button,.cibles button,.onglets button,.l25j-vues button,.l25j-types button,.tv button,.mes,.rres,.rinc button,.rmac button,.l26e1-ret,.tps button,.l25j-liste button{transition:background-color var(--t-retour)}
.pm button:active:not([aria-pressed=true]),.reva button:active:not([aria-pressed=true]),.rpm button:active:not([aria-pressed=true]),.rnum button:active,.rchoix button:active:not([aria-pressed=true]),.cibles button:active:not([aria-pressed=true]),.onglets button:active:not([aria-selected=true]),.l25j-vues button:active:not([aria-selected=true]),.l25j-types button:active:not([aria-pressed=true]),.rres:active,.l26e1-ret:active{background-color:var(--wash);transition-duration:.1s}
.tv button:active,.mes:active,.rinc button:not(.prim):active,.rmac button:active:not([aria-pressed=true]){filter:brightness(.96)}
.pm button.pop{animation-duration:var(--t-deplace)}
.rbarre i{transition-duration:var(--t-remplit)}
.feuille{animation-duration:var(--t-deplace)}
.rc.vient{animation-duration:var(--t-remplit)}
/* ===== fin du lot E1 de la 2.6 ===== */
</style>
